[package]
name = "throne"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "ThroneRs desktop client — Rust + GPUI rewrite of Throne"
homepage = "https://github.com/kandyjam/throne-rs"
# Binary must stay named `Throne` — Go ThroneCore parentcheck requires
# parent basename == "Throne" and ThroneCore living in the same directory.
# Display / bundle name is ThroneRs (see [package.metadata.bundle]).
default-run = "Throne"

[[bin]]
name = "Throne"
path = "src/main.rs"

[dependencies]
throne-domain = { workspace = true }
throne-core-client = { workspace = true }
throne-import = { workspace = true }
throne-storage = { workspace = true }
gpui = { workspace = true }
gpui-component = { workspace = true }
gpui-kit = { workspace = true }
gpui-kit-assets = { workspace = true }
lsp-types = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
smol = "2"
tray-icon = "0.25"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString"] }

# ── Desktop packaging (Zed-style) ───────────────────────────────────────
# macOS .app via cargo-bundle; DMG/tar.gz/deb/rpm/Inno via script/bundle-*.
# Mirror of zed-industries/zed `crates/zed` + `script/bundle-{mac,linux,windows}`.
#
#   ./script/bundle-mac
#   ./script/bundle-linux
#   ./script/bundle-windows.ps1
#   ./script/package            # host dispatcher
#
# Docs: docs/PACKAGING.md
[package.metadata.bundle]
name = "ThroneRs"
identifier = "app.throne.desktop"
icon = [
    "resources/app-icon-32.png",
    "resources/app-icon-128.png",
    "resources/app-icon-256.png",
    "resources/app-icon.png",
    "resources/app-icon@2x.png",
    "resources/app-icon.icns",
]
resources = []
copyright = "Copyright © Throne-rs contributors"
category = "Utility"
short_description = "Cross-platform GUI proxy client (sing-box / Xray)"
long_description = """
ThroneRs is a cross-platform GUI proxy configuration manager powered by
Sing-box / Xray. This is the Rust + GPUI rewrite of throneproj/Throne.
"""
osx_minimum_system_version = "11.0"
osx_url_schemes = ["throne"]
osx_info_plist_exts = []
deb_depends = [
    "libc6",
    "libx11-6",
    "libxcb1",
    "libxkbcommon0",
    "libwayland-client0",
    "libasound2 | libasound2t64",
]
