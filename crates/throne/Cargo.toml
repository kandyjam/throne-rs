[package]
name = "throne"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Throne desktop client — Rust + GPUI rewrite"
default-run = "throne"

[[bin]]
name = "throne"
path = "src/main.rs"

[dependencies]
throne-domain = { workspace = true }
throne-core-client = { workspace = true }
throne-import = { workspace = true }
throne-storage = { workspace = true }
# runtime_shaders: avoid requiring `xcrun metal` (full Xcode) at build time.
gpui = { workspace = true, features = ["runtime_shaders"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
