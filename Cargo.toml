[workspace]
resolver = "2"
members = [
    "crates/throne",
    "crates/throne-domain",
    "crates/throne-core-client",
    "crates/throne-import",
    "crates/throne-storage",
]
default-members = ["crates/throne"]

[workspace.package]
# Keep in lockstep with upstream throneproj/Throne release tags (NKR_VERSION / INPUT_VERSION).
# Latest audited: https://github.com/throneproj/Throne/releases → 4.3.7
version = "4.3.7"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/kandyjam/throne-rs"
authors = ["Throne-rs contributors"]

[workspace.dependencies]
throne-domain = { path = "crates/throne-domain" }
throne-core-client = { path = "crates/throne-core-client" }
throne-import = { path = "crates/throne-import" }
throne-storage = { path = "crates/throne-storage" }
gpui = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "net"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
anyhow = "1"
base64 = "0.22"
url = "2"
urlencoding = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_yaml = "0.9"
